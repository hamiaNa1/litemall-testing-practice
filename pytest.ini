[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    api: real HTTP + database tests
    ui: real Chromium UI flows
    defect: desired business assertions for actual unresolved defects (keep failing)
log_cli = false
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(message)s
